<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — NODE NOT FOUND · JASON:UNCK BBS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/media/juncklogoocto.png">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:      #0a0008;
  --gcyan:   #55ffff;
  --dcyan:   #008888;
  --ggreen:  #55ff55;
  --gred:    #ff5555;
  --dred:    #880000;
  --body:    #a8a8a8;
  --dim:     #555555;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  overflow: hidden;
}

#screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: #000;
  font-family: 'VT323', monospace;
  font-size: 17px;
  line-height: 1.25;
  color: var(--body);
}

/* CRT scanlines */
#screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.18) 3px,
    rgba(0,0,0,0.18) 4px
  );
  pointer-events: none;
  z-index: 100;
}

/* CRT vignette */
#screen::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.72) 100%);
  pointer-events: none;
  z-index: 101;
}

/* ── Main content ── */
#content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 32px;
  gap: 0;
}

.err-header {
  color: var(--dred);
  font-size: 13px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 28px;
}

.err-box {
  border: 1px solid var(--dred);
  padding: 32px 48px;
  max-width: 560px;
  width: 100%;
  position: relative;
}

.err-box::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,85,85,0.03);
  pointer-events: none;
}

.corner { position: absolute; width: 10px; height: 10px; border: 1px solid var(--dred); }
.corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
.corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
.corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

.err-code {
  color: var(--gred);
  font-size: 48px;
  line-height: 1;
  text-shadow: 0 0 16px rgba(255,85,85,0.4);
  letter-spacing: 0.04em;
  margin-bottom: 8px;
}

.err-title {
  color: var(--body);
  font-size: 20px;
  letter-spacing: 0.1em;
  margin-bottom: 24px;
}

.err-divider {
  border: none;
  border-top: 1px solid #2a0808;
  margin-bottom: 20px;
}

.err-body {
  color: var(--dim);
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: 0.04em;
  margin-bottom: 28px;
}

.err-body span {
  color: #444;
}

.err-prompt {
  color: var(--gcyan);
  font-size: 15px;
  letter-spacing: 0.08em;
  text-shadow: 0 0 8px rgba(85,255,255,0.35);
  cursor: pointer;
  display: inline-block;
  transition: color 0.15s;
}

.err-prompt:hover {
  color: #fff;
  text-shadow: 0 0 12px rgba(85,255,255,0.6);
}

.cursor-blink {
  display: inline-block;
  width: 9px;
  height: 15px;
  background: var(--gcyan);
  vertical-align: middle;
  margin-left: 2px;
  animation: blink 1s step-end infinite;
}

@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

/* ── Status bar ── */
#statusbar {
  flex-shrink: 0;
  height: 24px;
  background: var(--dred);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px;
  font-family: 'VT323', monospace;
  font-size: 17px;
  color: #000;
  letter-spacing: 0;
  line-height: 1;
  z-index: 50;
}
</style>
</head>
<body>
<div id="screen">

  <div id="content">
    <div class="err-header">▸ JASON:UNCK BBS · SYSTEM FAULT HANDLER</div>

    <div class="err-box">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>

      <div class="err-code">404</div>
      <div class="err-title">NODE NOT FOUND</div>
      <hr class="err-divider">
      <div class="err-body">
        The requested node could not be located<br>
        in the remote system's file allocation table.<br><br>
        <span>PATH: <span id="err-path" style="color:#555;"></span></span><br>
        <span>STATUS: CONNECTION TERMINATED BY HOST</span>
      </div>

      <div class="err-prompt" onclick="goHome()">
        [ PRESS ANY KEY OR CLICK TO RETURN TO MAIN BOARD ]<span class="cursor-blink"></span>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <span>JASON:UNCK BBS v1.0 &nbsp;·&nbsp; ERROR HANDLER ACTIVE</span>
    <span id="clock"></span>
  </div>

</div>
<script>
function goHome() {
  window.location.href = 'https://dinosandrobots.com';
}

document.addEventListener('keydown', goHome);

// Show the path that 404'd
const p = document.getElementById('err-path');
if (p) p.textContent = window.location.pathname || '/';

// Clock
function tick() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = h + ':' + m + ':' + s;
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
