<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Post 2 — Hero + 3-up</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gcyan: #55ffff;
  --dcyan: #008888;
  --ggreen: #55ff55;
  --gyellow: #ffff55;
  --gwhite: #ffffff;
  --gray: #a8a8a8;
  --dgray: #555;
  --rose: #ff8866;
}
html, body {
  background: #0a0008;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'IBM Plex Mono', monospace;
}
#canvas {
  width: 1080px; height: 1080px;
  position: relative;
  overflow: hidden;
  background: #000;
  flex-shrink: 0;
}
#bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
#scrim {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 85% 70% at 50% 45%, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.82) 60%, rgba(0,0,0,0.95) 100%);
  z-index: 2;
}
#scanlines {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,0.18) 2px 3px);
  z-index: 3; pointer-events: none; mix-blend-mode: multiply;
}

#card {
  position: absolute;
  top: 130px; bottom: 150px; left: 90px; right: 90px;
  z-index: 4;
  display: flex; flex-direction: column;
}

/* corner bracket frame */
.frame {
  position: relative;
  padding: 36px 36px 28px;
  flex-shrink: 0;
}
.frame::before, .frame::after,
.frame > .br-bl, .frame > .br-br {
  content: '';
  position: absolute;
  width: 36px; height: 36px;
  border: 2px solid var(--gcyan);
  filter: drop-shadow(0 0 8px rgba(85,255,255,0.4));
}
.frame::before { top: 0; left: 0; border-right: none; border-bottom: none; }
.frame::after { top: 0; right: 0; border-left: none; border-bottom: none; }
.frame .br-bl { bottom: 0; left: 0; border-right: none; border-top: none; }
.frame .br-br { bottom: 0; right: 0; border-left: none; border-top: none; }

.ttl {
  font-family: 'VT323', monospace;
  font-size: 130px;
  color: var(--gwhite);
  text-shadow: 0 0 22px var(--gwhite), 0 0 50px rgba(255,255,255,0.25);
  line-height: 0.95;
  letter-spacing: 0.02em;
  text-align: center;
}
.sub {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 300;
  font-size: 22px;
  color: var(--ggreen);
  text-shadow: 0 0 8px rgba(85,255,85,0.25);
  letter-spacing: 0.02em;
  margin-top: 18px;
  text-align: center;
}
.sub .caret { animation: blink 1.1s infinite; color: var(--ggreen); }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

.three-up {
  margin-top: 90px;
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0;
  align-items: start;
  position: relative;
}
.col {
  display: flex; flex-direction: column; align-items: center;
  padding: 0 20px;
  position: relative;
}
.col + .col::before {
  content: '';
  position: absolute;
  left: 0; top: 16px; bottom: 16px;
  width: 1px;
  background: rgba(0,136,136,0.5);
}
.icon { width: 92px; height: 92px; margin-bottom: 24px; }
.icon svg { width: 100%; height: 100%; display: block; }
.col-lbl {
  font-family: 'VT323', monospace;
  font-size: 30px;
  color: var(--gwhite);
  text-shadow: 0 0 10px rgba(255,255,255,0.5);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  margin-bottom: 12px;
  text-align: center;
}
.col-desc {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 300;
  font-size: 16px;
  color: var(--gray);
  line-height: 1.55;
  text-align: center;
  letter-spacing: 0.02em;
}

#brand {
  position: absolute;
  bottom: 56px;
  left: 0; right: 0;
  text-align: center;
  z-index: 5;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 18px;
  color: var(--dcyan);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
#brand .sep { color: #333; margin: 0 14px; }
</style>
</head>
<body>
<div id="canvas">
  <img id="bg" src="media/post-bg.png" alt="">
  <div id="scrim"></div>
  <div id="scanlines"></div>

  <div id="card">

    <div class="frame">
      <span class="br-bl"></span><span class="br-br"></span>
      <div class="ttl">THE&nbsp;HIDDEN<br>MARKET</div>
      <div class="sub">well… maybe not hidden &mdash; just an idea I had so I thought I'd share<span class="caret">_</span></div>
    </div>

    <div class="three-up">
      <div class="col">
        <div class="icon">
          <svg viewBox="0 0 100 100" fill="none" stroke="#ffffff" stroke-width="2">
            <circle cx="50" cy="50" r="38"/>
            <ellipse cx="50" cy="50" rx="38" ry="16"/>
            <ellipse cx="50" cy="50" rx="16" ry="38"/>
            <line x1="12" y1="50" x2="88" y2="50"/>
            <line x1="50" y1="12" x2="50" y2="88"/>
          </svg>
        </div>
        <div class="col-lbl">20+ Sources</div>
        <div class="col-desc">Job boards, career sites,<br>company pages, network</div>
      </div>
      <div class="col">
        <div class="icon">
          <svg viewBox="0 0 100 100" fill="#ff8866">
            <g transform="translate(50 50)">
              <g><rect x="-4" y="-44" width="8" height="88" rx="3"/></g>
              <g transform="rotate(30)"><rect x="-4" y="-44" width="8" height="88" rx="3"/></g>
              <g transform="rotate(60)"><rect x="-4" y="-44" width="8" height="88" rx="3"/></g>
              <g transform="rotate(90)"><rect x="-4" y="-44" width="8" height="88" rx="3"/></g>
              <g transform="rotate(120)"><rect x="-4" y="-44" width="8" height="88" rx="3"/></g>
              <g transform="rotate(150)"><rect x="-4" y="-44" width="8" height="88" rx="3"/></g>
              <circle r="8" fill="#ff8866"/>
            </g>
          </svg>
        </div>
        <div class="col-lbl" style="color: var(--rose); text-shadow: 0 0 10px rgba(255,136,102,0.5);">Claude + Cowork</div>
        <div class="col-desc">Automated research<br>workflow, on a schedule</div>
      </div>
      <div class="col">
        <div class="icon">
          <svg viewBox="0 0 100 100" fill="none" stroke="#ffffff" stroke-width="2">
            <path d="M22 14 H62 L78 30 V86 H22 Z"/>
            <polyline points="62 14 62 30 78 30"/>
            <line x1="32" y1="48" x2="68" y2="48"/>
            <line x1="32" y1="60" x2="68" y2="60"/>
            <line x1="32" y1="72" x2="56" y2="72"/>
          </svg>
        </div>
        <div class="col-lbl">Daily Report</div>
        <div class="col-desc">Saved to folder,<br>ready by 8 AM</div>
      </div>
    </div>

  </div>

  <div id="brand">jasonunck.com<span class="sep">·</span>linkedin.com/in/junck</div>
</div>
</body>
</html>
